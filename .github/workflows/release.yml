name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.release-notes.outputs.body }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify tag matches application version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const tauriConfig = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const cargoToml = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          const cargoVersion = cargoToml.match(/^version = "([^"]+)"/m)?.[1];
          const expectedTag = `v${packageJson.version}`;

          if (process.env.RELEASE_TAG !== expectedTag) {
            throw new Error(`Release tag ${process.env.RELEASE_TAG} does not match package version ${packageJson.version}. Expected ${expectedTag}.`);
          }

          if (tauriConfig.version !== packageJson.version) {
            throw new Error(`Tauri version ${tauriConfig.version} does not match package version ${packageJson.version}.`);
          }

          if (cargoVersion !== packageJson.version) {
            throw new Error(`Cargo version ${cargoVersion ?? 'missing'} does not match package version ${packageJson.version}.`);
          }
          EOF
      - name: Require and extract What's New release notes
        id: release-notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import { randomUUID } from 'node:crypto';

          const version = process.env.RELEASE_TAG.replace(/^v/, '');
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const heading = new RegExp(`^## \\[${version.replaceAll('.', '\\.')}\\][^\\n]*\\n`, 'm');
          const headingMatch = heading.exec(changelog);

          if (!headingMatch) {
            throw new Error(`CHANGELOG.md has no release entry for ${version}.`);
          }

          const releaseStart = headingMatch.index + headingMatch[0].length;
          const remainingChangelog = changelog.slice(releaseStart);
          const nextRelease = remainingChangelog.search(/^## \[/m);
          const release = nextRelease === -1 ? remainingChangelog : remainingChangelog.slice(0, nextRelease);
          const whatsNew = release.split(/^### What's New\s*$/m)[1]?.split(/^### /m)[0]?.trim();
          if (!whatsNew || !/^[-*]\s+\S/m.test(whatsNew)) {
            throw new Error(`CHANGELOG.md must include a non-empty "### What's New" section for ${version}.`);
          }

          const delimiter = `NOTES_${randomUUID()}`;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `body<<${delimiter}\n### What's New\n\n${whatsNew}\n${delimiter}\n`);
          EOF

  publish:
    name: Package (${{ matrix.label }})
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            platform: ubuntu-22.04
            sockseekTarget: x86_64-unknown-linux-gnu
            rustTargets: ''
            args: '--bundles deb,appimage'
          - label: macOS Apple Silicon
            platform: macos-latest
            sockseekTarget: aarch64-apple-darwin
            rustTargets: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin --bundles app,dmg'
          - label: macOS Intel
            platform: macos-latest
            sockseekTarget: x86_64-apple-darwin
            rustTargets: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin --bundles app,dmg'
          - label: Windows x86_64
            platform: windows-latest
            sockseekTarget: x86_64-pc-windows-msvc
            rustTargets: ''
            args: '--bundles nsis,msi'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Fetch pinned Sockseek sidecar
        env:
          SOCKSEEK_TARGET: ${{ matrix.sockseekTarget }}
        run: node scripts/fetch-sockseek-sidecar.mjs
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Refrain ${{ github.ref_name }}'
          releaseBody: ${{ needs.validate-tag.outputs.release_body }}
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
