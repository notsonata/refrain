name: Format milestone 5

on:
  push:
    branches:
      - feat/milestone-5-v0.1-desktop-experience

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write src/App.svelte src/components/TrackList.svelte src/components/TrackList.test.ts
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.svelte src/components/TrackList.svelte src/components/TrackList.test.ts src-tauri/src
          if ! git diff --cached --quiet; then
            git commit -m "chore: format milestone 5 changes"
            git push origin HEAD:${{ github.ref_name }}
          fi
