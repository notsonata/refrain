[package]
name = "refrain"
version = "0.1.0"
description = "Mirror Spotify playlists and Liked Songs to a local music library"
authors = ["notsonata"]
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "refrain_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
tauri = { version = "=2.11.5", features = [] }
tracing = "=0.1.44"
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
