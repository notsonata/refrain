[package]
name = "refrain"
version = "0.1.0"
description = "Mirror Spotify playlists, Liked Songs, and saved albums to a local music library"
authors = ["notsonata"]
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
name = "refrain_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.23.1"
blake3 = "=1.8.7"
getrandom = { version = "=0.4.3", features = ["std"] }
keyring = "=4.2.0"
lofty = "=0.25.4"
open = "=5.4.4"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "form", "json", "rustls"] }
rusqlite = { version = "=0.40.1", features = ["bundled"] }
rusqlite_migration = "=2.6.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
strsim = "=0.11.1"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.3"
tracing = "=0.1.44"
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
unicode-normalization = "=0.1.24"
url = "=2.5.8"
walkdir = "=2.5.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
